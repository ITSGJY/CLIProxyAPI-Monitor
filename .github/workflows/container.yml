name: Container

on:
  push:
    branches:
      - main
      - feat/phase6-legacy-import
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itsgjy/cliproxyapi-monitor
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish immutable multi-architecture Monitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published ARM64 manifest and runtime
        run: |
          IMAGE=ghcr.io/itsgjy/cliproxyapi-monitor:sha-${GITHUB_SHA::7}
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/monitor-image-manifest.txt
          grep -q 'linux/arm64' /tmp/monitor-image-manifest.txt
          docker run --rm --platform linux/arm64 "$IMAGE" node -e 'if (process.arch !== "arm64") process.exit(1); console.log("ARM64 runtime verified")'

      - name: Pull published image for runtime smoke test
        run: docker pull ghcr.io/itsgjy/cliproxyapi-monitor:sha-${GITHUB_SHA::7}

      - name: Smoke test standalone container
        run: |
          docker run -d --name monitor-container-smoke \
            -p 127.0.0.1:3000:3000 \
            -e PASSWORD=phase7-container-smoke-password \
            -e CRON_SECRET=phase7-container-smoke-cron \
            ghcr.io/itsgjy/cliproxyapi-monitor:sha-${GITHUB_SHA::7}
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs monitor-container-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f monitor-container-smoke 2>/dev/null || true
